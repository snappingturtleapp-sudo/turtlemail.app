<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smarty Test — Throwaway</title>
<style>
  body { font-family: monospace; background: #121214; color: #E6F2FF; padding: 30px; }
  button { padding: 12px 20px; font-size: 14px; cursor: pointer; margin-bottom: 20px; }
  pre { background: #1E293B; padding: 20px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  .row { margin-bottom: 6px; }
</style>
</head>
<body>

<h2>Smarty Validation — Isolated Test (not part of the real site)</h2>
<p>Testing 3 addresses: one clearly good, one with a typo Smarty should still fix, one nonsense address that should fail to verify.</p>

<button onclick="runTest()">Run Test</button>
<div id="status"></div>
<pre id="output">(results will appear here)</pre>

<script>
const API_BASE_URL = "https://api.turtlemail.app";

const testAddresses = [
  { street: "1602 Amphitheatre Parkway", city: "Mountain View", state: "CA", zip: "94043" }
];

async function runTest(){
  document.getElementById('status').textContent = 'Sending request...';
  document.getElementById('output').textContent = '';

  try {
    const res = await fetch(`${API_BASE_URL}/api/validate-addresses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addresses: testAddresses })
    });

    const data = await res.json();
    document.getElementById('status').textContent = `HTTP status: ${res.status}`;
    document.getElementById('output').textContent = JSON.stringify(data, null, 2);
  } catch (err){
    document.getElementById('status').textContent = 'Request failed entirely — see console.';
    document.getElementById('output').textContent = err.message;
  }
}
</script>

</body>
</html>
